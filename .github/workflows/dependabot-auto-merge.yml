name: Dependabot auto-merge

# Liga o auto-merge (`gh pr merge --auto --merge`) no PR do Dependabot que é de `npm`, de minor ou
# patch, e abre contra `develop`; vale para o PR agrupado e para o de segurança. O merge só
# acontece quando os checks exigidos pelo ruleset ficam verdes: o workflow não aprova nem pula
# check. Major nunca entra (nem o de segurança, que o `ignore` do dependabot.yml não alcança), e
# `github-actions` fica com merge manual. Roda em `pull_request`, nunca em `pull_request_target`.
# Pré-condição: o ruleset de `develop` já exige `quality` antes de `allow_auto_merge` ficar ligado;
# com a flag ligada e o ruleset sem esse check, `gh pr merge --auto` mergeia o PR do bot na hora,
# com o CI ainda rodando. Desligar a flag ou afrouxar o ruleset reabre esse furo.
on:
  pull_request:

permissions: {}

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop'
    # Pushes ou rebases seguidos do Dependabot no mesmo PR cancelam a execução anterior.
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      # O `package-ecosystem` sai do nome da branch do PR: `npm_and_yarn` para o npm,
      # `github_actions` para as actions. O `update-type` é a maior mudança do PR agrupado.
      # Filtro fail-closed: valor vazio não mergeia. O formato do PR de security update nunca foi
      # visto; o 1º real confere se os dois outputs vêm preenchidos (o log do fetch-metadata
      # mostra os valores).
      - name: Enable auto-merge for npm minor and patch
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

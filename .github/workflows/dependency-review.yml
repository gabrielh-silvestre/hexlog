name: Dependency review

# O job `dependency-review` roda em todo PR, sem filtro de `paths`, para o check obrigatório do
# ruleset nunca ficar pendente. Falha em dependência nova com advisory `high` ou acima; sem filtro
# de licença. Depende do dependency graph do repositório (ativo no repositório público).
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

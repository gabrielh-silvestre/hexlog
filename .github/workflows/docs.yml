name: Docs

# O job `docs` roda em todo PR, qualquer base e sem filtro de `paths`, para o check que o ruleset
# vai exigir nunca ficar pendente. Confere todos os `.md` do repositório (menos `docs/pesquisa/**`,
# congelado) com o markdownlint e o cspell, as mesmas configs do pre-commit.
on:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
      - run: npm ci
      - run: npm run lint:md
      - run: npm run spell

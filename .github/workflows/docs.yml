name: Docs

# O job `docs` roda em todo PR, qualquer base e sem filtro de `paths`, para o check obrigatório do
# ruleset nunca ficar pendente. Confere todos os `.md` do repositório (menos `docs/pesquisa/**`,
# congelado) com o markdownlint e o cspell, as mesmas configs do pre-commit.
on:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.1'
      - run: npm ci
      - run: npm run lint:md
      - run: npm run spell

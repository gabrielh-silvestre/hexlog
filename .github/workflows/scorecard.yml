name: Scorecard

# Medidor, não gate: roda só na branch padrão (`schedule` e `push` em `develop`) e sob demanda
# (`workflow_dispatch`, a medida que vale depois que o ruleset e os demais workflows existem).
# O SARIF vai para a aba Security; não publica na API do Scorecard (`publish_results: false`),
# então o job dispensa `id-token: write`. Não está no ruleset.
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
